<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Change Maker | 給与両替 計算ツール</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Change Maker">
<meta name="theme-color" content="#F4F2EC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F4F2EC;
    --card: #FFFFFF;
    --ink: #16181D;
    --muted: #8A877F;
    --faint: #C4C0B5;
    --line: #E9E6DD;
    --accent: #19D3A2;
    --accent-deep: #0E9F7E;
    --accent-soft: rgba(25,211,162,0.16);
    --danger: #E2604A;
    --pad-h: 264px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; padding:0; -webkit-text-size-adjust:100%; }
  body{
    background:
      radial-gradient(560px 360px at 105% -90px, rgba(25,211,162,0.20), transparent 70%),
      radial-gradient(480px 340px at -25% 14%, rgba(255,196,120,0.24), transparent 70%),
      var(--bg);
    background-attachment: fixed;
    color: var(--ink);
    font-family: 'Zen Kaku Gothic New', sans-serif;
    min-height: 100vh;
    padding: calc(env(safe-area-inset-top) + 22px) 16px 40px;
    -webkit-font-smoothing: antialiased;
    user-select: none;
    -webkit-user-select: none;
  }
  body.mode-input{ padding-bottom: calc(env(safe-area-inset-bottom) + 110px); }
  body.mode-input.pad-open{ padding-bottom: calc(var(--pad-h) + 28px); }
  body.mode-result{ padding-bottom: calc(env(safe-area-inset-bottom) + 110px); }
  .wrap{ max-width: 420px; margin: 0 auto; }

  /* ---------- header ---------- */
  header{
    display:flex;
    align-items:center;
    gap: 12px;
    margin-bottom: 26px;
  }
  .logo{
    width: 42px; height: 42px;
    border-radius: 14px;
    flex-shrink:0;
    background: var(--accent);
    color: #06281F;
    display:flex; align-items:center; justify-content:center;
    font-family:'Manrope', sans-serif;
    font-weight:800;
    font-size: 21px;
    box-shadow: 0 8px 18px rgba(25,211,162,0.32);
  }
  .brand{ flex:1; min-width:0; }
  .brand .name{
    font-family:'Manrope', sans-serif;
    font-weight: 800;
    font-size: 23px;
    line-height: 1.1;
    letter-spacing: -0.01em;
  }
  .pill{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size: 12px;
    color: var(--muted);
    background: rgba(255,255,255,0.7);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 14px;
    cursor:pointer;
    transition: color .15s ease, border-color .15s ease, background .15s ease;
  }
  .pill.confirm{ color:#fff; background: var(--danger); border-color: var(--danger); }
  body.mode-result #clearBtn{ display:none; }

  body.mode-input #resultView, body.mode-input #resultBar{ display:none; }
  body.mode-result #inputView, body.mode-result .numpad, body.mode-result #calcBar{ display:none; }
  /* テンキーは入力欄をタップしたときだけ表示。閉じている間は「計算する」バーを出す */
  body.mode-input:not(.pad-open) .numpad{ display:none; }
  body.mode-input.pad-open #calcBar{ display:none; }

  /* ---------- sections ---------- */
  section{ margin-bottom: 26px; }
  .sec-head{
    display:flex;
    align-items:baseline;
    gap: 9px;
    margin-bottom: 10px;
  }
  .sec-head .num{
    font-family:'Manrope', sans-serif;
    font-weight: 800;
    font-size: 13px;
    color: var(--accent-deep);
    background: var(--accent-soft);
    padding: 2px 8px;
    border-radius: 999px;
  }
  .sec-head .ttl{ font-weight: 700; font-size: 16px; }
  .grid{ display:grid; grid-template-columns: 1fr; gap: 8px; }

  /* ---------- tiles ---------- */
  .tile{
    background: var(--card);
    border: 1.5px solid var(--line);
    border-radius: 18px;
    padding: 10px 14px;
    min-height: 52px;
    display:flex;
    align-items:center;
    gap: 12px;
    cursor:pointer;
    transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    scroll-margin: 96px 0 calc(var(--pad-h) + 16px);
    outline: none;
  }
  .tile.active{
    border-color: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft), 0 12px 26px rgba(70,55,20,0.09);
  }
  .tile .top{ display:flex; align-items:center; gap: 9px; flex-shrink:0; min-width: 100px; }
  .tile .name{ font-size: 13px; color: var(--muted); font-weight: 700; }
  .tile .field{ flex:1; min-width:0; display:flex; align-items:baseline; gap: 6px; }
  .val{
    flex:1;
    min-width:0;
    text-align:right;
    font-family:'Manrope', sans-serif;
    font-weight: 800;
    font-size: 26px;
    line-height: 1.15;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .val.empty::before{ content:"0"; color: var(--faint); }
  .tile.active .val.empty::before{ content:""; }
  .tile.active .val::after{
    content:"";
    display:inline-block;
    width: 2.5px; height: .95em;
    margin-left: 3px;
    vertical-align: -0.12em;
    background: var(--accent-deep);
    border-radius: 2px;
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  .suffix{ font-size: 12px; color: var(--muted); flex-shrink:0; }

  .idx{
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
    font-family:'Manrope', sans-serif;
    font-weight: 800;
    font-size: 11px;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    margin: 0 12px 0 12px;
  }

  /* ---------- お金アイコン(PNG) ---------- */
  .chipbox{ width: 46px; height: 30px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .money{
    display:block;
    height:auto;
    pointer-events:none;
    -webkit-user-drag:none;
    -webkit-touch-callout:none;
  }
  .money.note{ width: 44px; filter: drop-shadow(0 1px 2px rgba(60,50,20,0.28)); }
  .money.coin{ filter: drop-shadow(0 1px 2px rgba(60,50,20,0.30)); }
  /* コインの大きさは実物の直径比(500円=25.2pxを基準) */
  .money.c500{ width: 25.2px; }
  .money.c100{ width: 21.6px; }
  .money.c50{  width: 19.8px; }
  .money.c10{  width: 22.5px; }
  .money.c5{   width: 20.7px; }
  .money.c1{   width: 18.9px; }

  /* ---------- numpad ---------- */
  .numpad{
    position: fixed;
    left:0; right:0; bottom:0;
    z-index: 20;
    padding: 12px 12px calc(env(safe-area-inset-bottom) + 12px);
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-top: 1px solid var(--line);
    border-radius: 24px 24px 0 0;
    box-shadow: 0 -12px 32px rgba(70,55,20,0.08);
  }
  .keys{
    max-width: 420px;
    margin: 0 auto;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }
  .key{
    height: 52px;
    border: none;
    border-radius: 15px;
    background: #fff;
    box-shadow: 0 0 0 1px var(--line) inset, 0 2px 0 var(--line);
    font-family:'Manrope', sans-serif;
    font-weight: 800;
    font-size: 22px;
    color: var(--ink);
    cursor:pointer;
    touch-action: manipulation;
    display:flex; align-items:center; justify-content:center;
    transition: transform .06s ease, background .1s ease;
  }
  .key:active{ transform: translateY(2px) scale(.97); background:#F0EDE5; box-shadow: 0 0 0 1px var(--line) inset; }
  .key.fn{ font-family:'Zen Kaku Gothic New', sans-serif; font-size: 14px; font-weight: 700; color: var(--muted); background:#F6F4EE; }
  .key.next{
    grid-column: 4; grid-row: 2 / 4;
    height: auto;
    flex-direction: column; gap: 4px;
    background: var(--accent);
    color: #06281F;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size: 16px;
    box-shadow: 0 8px 18px rgba(25,211,162,0.32);
  }
  .key.next:active{ background:#13BD90; }
  .key.next .arrow{ font-family:'Manrope', sans-serif; font-size: 22px; line-height:1; }
  .key.calc{
    background: var(--ink);
    color:#fff;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size: 15px;
    box-shadow: none;
  }
  .key.calc:active{ background:#000; }

  /* ---------- action bar (result) ---------- */
  .actionbar{
    position: fixed;
    left:0; right:0; bottom:0;
    z-index: 20;
    padding: 14px 16px calc(env(safe-area-inset-bottom) + 14px);
    background: linear-gradient(to top, rgba(244,242,236,0.97) 60%, rgba(244,242,236,0));
  }
  .actionbar .inner{ max-width: 420px; margin: 0 auto; display:flex; gap: 10px; }
  .btn{
    height: 54px;
    border: none;
    border-radius: 16px;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight: 700;
    font-size: 15px;
    cursor:pointer;
    touch-action: manipulation;
    transition: transform .08s ease;
  }
  .btn:active{ transform: scale(.98); }
  .btn.ghost{ flex:1; background:#fff; color: var(--ink); box-shadow: 0 0 0 1px var(--line) inset; }
  .btn.main{ flex:1; background: var(--accent); color:#06281F; box-shadow: 0 8px 18px rgba(25,211,162,0.32); }

  /* ---------- receipt ---------- */
  .receipt-wrap{ filter: drop-shadow(0 14px 26px rgba(70,55,20,0.14)); margin: 14px 4px 24px; }
  .receipt{
    position: relative;
    background: #fff;
    padding: 28px 18px 22px;
    font-family:'DM Mono','Zen Kaku Gothic New', monospace;
    color: #1B1B1B;
    font-size: 13px;
    clip-path: inset(-14px -14px 100% -14px);
    user-select: text;
    -webkit-user-select: text;
  }
  .receipt.show{ animation: printOut 1.15s cubic-bezier(.3,.7,.2,1) forwards; }
  @keyframes printOut{
    from{ clip-path: inset(-14px -14px 100% -14px); }
    to{   clip-path: inset(-14px -14px -14px -14px); }
  }
  .receipt::before, .receipt::after{
    content:"";
    position:absolute; left:0; right:0; height:10px;
    background-size: 10px 10px;
  }
  .receipt::before{
    top:-10px;
    background-image:
      linear-gradient(-45deg, #fff 5px, transparent 0),
      linear-gradient(45deg, #fff 5px, transparent 0);
  }
  .receipt::after{
    bottom:-10px;
    background-image:
      linear-gradient(135deg, #fff 5px, transparent 0),
      linear-gradient(-135deg, #fff 5px, transparent 0);
  }
  .rc-title{ text-align:center; font-weight:500; font-size:15px; letter-spacing:.26em; }
  .rc-date{ text-align:center; margin-top: 8px; color: var(--muted); font-size: 11px; }
  .rc-hr{ border-top: 1.5px dashed #CFCBC0; margin: 14px 0; }
  .rc-head, .rc-row{
    display:grid;
    grid-template-columns: 1.15fr .8fr .8fr 1.6fr;
    gap: 4px;
    align-items: baseline;
  }
  .rc-head{ font-family:'Zen Kaku Gothic New', sans-serif; font-size: 10.5px; font-weight:700; color: var(--muted); padding-bottom: 6px; }
  .rc-head div:not(:first-child), .rc-row div:not(:first-child){ text-align:right; }
  .rc-row{ padding: 7px 0; border-bottom: 1px dotted #E3DFD4; opacity:0; transform: translateY(4px); }
  .receipt.show .rc-row{ animation: rowIn .35s ease forwards; animation-delay: calc(var(--i) * 70ms + 350ms); }
  @keyframes rowIn{ to{ opacity:1; transform:none; } }
  .rc-row.zero{ color: #B9B5AA; }
  .rc-row.total{ border-top: 1.5px solid #1B1B1B; border-bottom: none; margin-top: 2px; padding-top: 9px; }
  .rc-row.total .c-name{ font-size: 14px; }
  .rc-row .c-name{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size: 13px; }
  .rc-row .c-cov{ color: var(--muted); }
  .rc-row .c-fin b{ font-weight: 500; font-size: 17px; }
  .rc-line{ display:flex; justify-content:space-between; padding: 3px 0; font-size: 12.5px; }
  .rc-line span:first-child{ font-family:'Zen Kaku Gothic New', sans-serif; color:#55534D; }
  .rc-total{ display:flex; justify-content:space-between; align-items:baseline; margin-top: 10px; }
  .rc-total span{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size: 14px; }
  .rc-total strong{
    font-family:'Manrope', sans-serif;
    font-weight: 800;
    font-size: 34px;
    letter-spacing: -0.01em;
    padding: 0 4px;
    background: linear-gradient(transparent 58%, var(--accent) 58%, var(--accent) 92%, transparent 92%);
  }
  .rc-cap{ font-family:'Zen Kaku Gothic New', sans-serif; font-weight:700; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .rc-barcode{
    height: 34px;
    margin: 16px 0 6px;
    background: repeating-linear-gradient(90deg,
      #1B1B1B 0 2px, transparent 2px 4px,
      #1B1B1B 4px 5px, transparent 5px 8px,
      #1B1B1B 8px 11px, transparent 11px 13px,
      #1B1B1B 13px 14px, transparent 14px 17px);
    opacity: .85;
  }
  .rc-end{ text-align:center; font-size: 10px; color: var(--muted); letter-spacing:.3em; }

  footer{ text-align:center; margin-top: 8px; font-size:10.5px; color: var(--faint); letter-spacing:.24em; font-family:'Manrope',sans-serif; font-weight:700; }

  @media (max-width: 360px){
    .val{ font-size: 23px; }
    .rc-total strong{ font-size: 29px; }
  }
  @media (prefers-reduced-motion: reduce){
    .receipt, .receipt.show{ animation:none; clip-path:none; }
    .receipt .rc-row{ opacity:1; transform:none; animation:none !important; }
  }
</style>
</head>
<body class="mode-input">
<div class="wrap">

  <header>
    <div class="logo">¥</div>
    <div class="brand">
      <div class="name">Change Maker</div>
    </div>
    <button class="pill" id="clearBtn" type="button">クリア</button>
  </header>

  <div id="inputView">
    <section>
      <div class="sec-head"><span class="num">01</span><span class="ttl">必要な金種内訳</span></div>
      <div class="grid" id="needCard"></div>
    </section>

    <section>
      <div class="sec-head"><span class="num">02</span><span class="ttl">引き出し金額(4件)</span></div>
      <div class="grid" id="withdrawCard"></div>
    </section>
  </div>

  <div id="resultView">
    <div class="receipt-wrap">
      <div class="receipt" id="receipt"></div>
    </div>
  </div>

  <footer>CHANGE MAKER</footer>
</div>

<!-- テンキー(入力画面) -->
<div class="numpad" id="numpad">
  <div class="keys" id="keys">
    <button class="key" data-k="7" type="button">7</button>
    <button class="key" data-k="8" type="button">8</button>
    <button class="key" data-k="9" type="button">9</button>
    <button class="key fn" data-k="back" type="button" aria-label="1文字消す">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>
    </button>
    <button class="key" data-k="4" type="button">4</button>
    <button class="key" data-k="5" type="button">5</button>
    <button class="key" data-k="6" type="button">6</button>
    <button class="key next" data-k="next" id="nextKey" type="button"><span id="nextLabel">次へ</span><span class="arrow" id="nextArrow">↓</span></button>
    <button class="key" data-k="1" type="button">1</button>
    <button class="key" data-k="2" type="button">2</button>
    <button class="key" data-k="3" type="button">3</button>
    <button class="key" data-k="0" type="button">0</button>
    <button class="key" data-k="00" type="button">00</button>
    <button class="key fn" data-k="prev" type="button">前へ</button>
    <button class="key calc" data-k="calc" type="button">計算</button>
  </div>
</div>

<!-- 計算バー(入力画面・テンキーが閉じているとき) -->
<div class="actionbar" id="calcBar">
  <div class="inner">
    <button class="btn main" id="calcBtn" type="button">計算する</button>
  </div>
</div>

<!-- アクション(結果画面) -->
<div class="actionbar" id="resultBar">
  <div class="inner">
    <button class="btn ghost" id="editBtn" type="button">修正する</button>
  </div>
</div>

<script>
const DENOMS = [5000,1000,500,100,50,10,5,1];
const NOTES = [5000,1000];
const LABELS = {5000:'5000円',1000:'1000円',500:'500円',100:'100円',50:'50円',10:'10円',5:'5円',1:'1円'};
const STORE_KEY = 'denomi_v1';

// 入力欄の並び順(テンキーの「次へ」はこの順に進む)
const FIELDS = [
  ...DENOMS.map(d => ({id:'need-'+d, max:5})),
  ...[1,2,3,4].map(i => ({id:'withdraw-'+i, max:8}))
];
let active = 0;
let lastCtx = null;

/* ---------- 部品 ---------- */
const NOTE_SIZE = {5000:[240,109], 1000:[240,115]};
function chipHTML(d){
  if(NOTES.includes(d)){
    const [w,h] = NOTE_SIZE[d];
    return `<div class="chipbox"><img class="money note" src="note-${d}.png" width="${w}" height="${h}" alt="" draggable="false"></div>`;
  }
  return `<div class="chipbox"><img class="money coin c${d}" src="coin-${d}.png" width="144" height="144" alt="" draggable="false"></div>`;
}

function buildTiles(){
  document.getElementById('needCard').innerHTML = DENOMS.map(d => `
    <div class="tile" data-id="need-${d}" role="button" tabindex="0">
      <div class="top">${chipHTML(d)}<div class="name">${LABELS[d]}</div></div>
      <div class="field"><span class="val empty"></span><span class="suffix">枚</span></div>
      <input type="hidden" id="need-${d}" value="">
    </div>`).join('');

  document.getElementById('withdrawCard').innerHTML = [1,2,3,4].map(i => `
    <div class="tile w" data-id="withdraw-${i}" role="button" tabindex="0">
      <div class="top"><div class="idx">${i}</div><div class="name">引き出し</div></div>
      <div class="field"><span class="val empty"></span><span class="suffix">円</span></div>
      <input type="hidden" id="withdraw-${i}" value="">
    </div>`).join('');
}

function refresh(id){
  const input = document.getElementById(id);
  const val = input.closest('.tile').querySelector('.val');
  const v = input.value;
  val.textContent = v === '' ? '' : Number(v).toLocaleString('ja-JP');
  val.classList.toggle('empty', v === '');
}
function refreshAll(){ FIELDS.forEach(f => refresh(f.id)); }

/* ---------- 入力操作 ---------- */
function setActive(i, scroll = true){
  active = Math.max(0, Math.min(FIELDS.length - 1, i));
  document.querySelectorAll('.tile').forEach(t => t.classList.toggle('active', t.dataset.id === FIELDS[active].id));
  const last = active === FIELDS.length - 1;
  document.getElementById('nextLabel').textContent = last ? '計算' : '次へ';
  document.getElementById('nextArrow').textContent = last ? '✓' : '↓';
  if(scroll){
    const tile = document.querySelector('.tile.active');
    if(tile) tile.scrollIntoView({block:'nearest', behavior:'smooth'});
  }
}

function press(k){
  const f = FIELDS[active];
  const el = document.getElementById(f.id);
  let v = el.value;
  if(k === 'back'){
    v = v.slice(0, -1);
  }else if(/^\d{1,2}$/.test(k)){
    if(v === ''){ v = (k === '00') ? '0' : k; }
    else if(v === '0'){ v = (k === '00') ? '0' : k; }
    else{
      if((v + k).length > f.max) return;
      v += k;
    }
  }
  el.value = v;
  refresh(f.id);
  saveState();
}
function openPad(i){
  document.body.classList.add('pad-open');
  measurePad();
  setActive(i);
}
function closePad(){
  document.body.classList.remove('pad-open');
  document.querySelectorAll('.tile.active').forEach(t => t.classList.remove('active'));
}
function goNext(){
  if(active < FIELDS.length - 1) setActive(active + 1);
  else calculate();
}
function goPrev(){ setActive(active - 1); }

/* ---------- 保存 ---------- */
function saveState(){
  const state = {};
  DENOMS.forEach(d => state['need-'+d] = document.getElementById('need-'+d).value);
  [1,2,3,4].forEach(i => state['withdraw-'+i] = document.getElementById('withdraw-'+i).value);
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}
function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const state = JSON.parse(raw);
    Object.keys(state).forEach(id => {
      const el = document.getElementById(id);
      if(el && state[id] !== '') el.value = String(state[id]).replace(/\D/g, '');
    });
  }catch(e){}
}

function num(id){
  const el = document.getElementById(id);
  const v = parseInt(el.value, 10);
  return isNaN(v) || v < 0 ? 0 : v;
}

/* ---------- 計算(ロジックは従来どおり) ---------- */
function calculate(){
  // 1. 入力内訳の読み取り(1万円札は対象外)
  const inputCounts = {};
  DENOMS.forEach(d => inputCounts[d] = num('need-'+d));

  // 2. 4件の引き出し額から確実にある枚数を算出(個別に計算し合算)
  const guaranteed = {1000:0, 100:0, 10:0, 1:0};
  const withdraws = [];
  [1,2,3,4].forEach(i => {
    const T = num('withdraw-'+i);
    withdraws.push(T);
    guaranteed[1000] += Math.floor((T % 5000)/1000);
    guaranteed[100]  += Math.floor((T % 500)/100);
    guaranteed[10]   += Math.floor((T % 50)/10);
    guaranteed[1]    += Math.floor((T % 5)/1);
  });

  // 3. 必要枚数から確実にある分を差し引く(マイナスは0で止める)
  const adjusted = {...inputCounts};
  [1000,100,10,1].forEach(d => {
    adjusted[d] = Math.max(0, inputCounts[d] - guaranteed[d]);
  });

  // 4. 差し引き後の合計を1万円単位に切り上げ
  const adjustedTotal = DENOMS.reduce((sum,d) => sum + d*adjusted[d], 0);
  const rounded = Math.ceil(adjustedTotal/10000)*10000;
  let remaining = rounded - adjustedTotal;

  // 5. 差額を大きい金種から充当
  const fillDenoms = [5000,1000,500,100,50,10,5,1];
  const final = {...adjusted};
  fillDenoms.forEach(d => {
    const c = Math.floor(remaining/d);
    final[d] += c;
    remaining -= c*d;
  });

  // レシート表示用の内訳
  const covered = {}, fill = {};
  DENOMS.forEach(d => {
    covered[d] = inputCounts[d] - adjusted[d];
    fill[d] = final[d] - adjusted[d];
  });
  const sum = (o) => DENOMS.reduce((s,d) => s + d*o[d], 0);
  lastCtx = {
    need: inputCounts, covered, fill, final, withdraws,
    needTotal: sum(inputCounts),
    coveredTotal: sum(covered),
    fillTotal: sum(fill),
    exchange: sum(final),
    stamp: stamp()
  };

  saveState();
  renderReceipt(lastCtx);
  showResult();
}

/* ---------- レシート ---------- */
function yen(n){ return '¥' + n.toLocaleString('ja-JP'); }
function stamp(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}/${p(d.getMonth()+1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function renderReceipt(c){
  const rows = DENOMS.map((d, i) => {
    const zero = c.final[d] === 0 && c.need[d] === 0;
    return `
      <div class="rc-row${zero ? ' zero' : ''}" data-d="${d}" style="--i:${i}">
        <div class="c-name">${LABELS[d]}</div>
        <div class="c-need">${c.need[d]}</div>
        <div class="c-cov">${c.covered[d] > 0 ? '-' + c.covered[d] : '–'}</div>
        <div class="c-fin"><b>${c.final[d]}</b></div>
      </div>`;
  }).join('');

  const wd = c.withdraws.map((v, i) => `
      <div class="rc-line"><span>${i+1}件目</span><span>${v > 0 ? yen(v) : '—'}</span></div>`).join('');

  const totalCount = DENOMS.reduce((s, d) => s + c.final[d], 0);

  document.getElementById('receipt').innerHTML = `
    <div class="rc-title">CHANGE MAKER</div>
    <div class="rc-date">${c.stamp}</div>
    <div class="rc-hr"></div>
    <div class="rc-head"><div>金種</div><div>必要</div><div>引出</div><div>両替(枚)</div></div>
    ${rows}
    <div class="rc-row total" style="--i:${DENOMS.length}">
      <div class="c-name">合計</div>
      <div class="c-need"></div>
      <div class="c-cov"></div>
      <div class="c-fin"><b>${totalCount}</b></div>
    </div>
    <div class="rc-hr"></div>
    <div class="rc-line"><span>必要額</span><span>${yen(c.needTotal)}</span></div>
    <div class="rc-line"><span>引き出しで確保</span><span>${c.coveredTotal > 0 ? '-' : ''}${yen(c.coveredTotal)}</span></div>
    <div class="rc-line"><span>1万円単位への端数調整</span><span>${c.fillTotal > 0 ? '+' : ''}${yen(c.fillTotal)}</span></div>
    <div class="rc-total"><span>両替額</span><strong id="rcTotal">${yen(c.exchange)}</strong></div>
    <div class="rc-hr"></div>
    <div class="rc-cap">引き出し金額</div>
    ${wd}
    <div class="rc-barcode"></div>
    <div class="rc-end">THANK YOU</div>
  `;
}

function countUp(el, target){
  const dur = 700, start = performance.now();
  function tick(now){
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = yen(Math.round(target * eased));
    if(t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function showResult(){
  closePad();
  document.body.classList.remove('mode-input');
  document.body.classList.add('mode-result');
  window.scrollTo({top: 0});
  const r = document.getElementById('receipt');
  r.classList.remove('show');
  void r.offsetWidth;
  r.classList.add('show');
  countUp(document.getElementById('rcTotal'), lastCtx.exchange);
}
function showInput(){
  document.body.classList.remove('mode-result');
  document.body.classList.add('mode-input');
  closePad();
}

/* ---------- クリア(2回タップで確定) ---------- */
function clearAll(){
  FIELDS.forEach(f => { document.getElementById(f.id).value = ''; });
  refreshAll();
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
  closePad();
  window.scrollTo({top: 0, behavior: 'smooth'});
}
let clearArmed = false, clearTimer = null;
function onClearTap(){
  const btn = document.getElementById('clearBtn');
  if(!clearArmed){
    clearArmed = true;
    btn.textContent = 'もう一度タップ';
    btn.classList.add('confirm');
    clearTimer = setTimeout(disarmClear, 2500);
  }else{
    disarmClear();
    clearAll();
  }
}
function disarmClear(){
  clearArmed = false;
  clearTimeout(clearTimer);
  const btn = document.getElementById('clearBtn');
  btn.textContent = 'クリア';
  btn.classList.remove('confirm');
}

/* ---------- 初期化 ---------- */
function measurePad(){
  const h = document.getElementById('numpad').offsetHeight;
  if(h > 0) document.documentElement.style.setProperty('--pad-h', h + 'px');
}

buildTiles();
loadState();
refreshAll();

document.getElementById('keys').addEventListener('click', e => {
  const b = e.target.closest('button[data-k]');
  if(!b) return;
  const k = b.dataset.k;
  if(k === 'next') goNext();
  else if(k === 'prev') goPrev();
  else if(k === 'calc') calculate();
  else press(k);
});
document.querySelectorAll('.tile').forEach(t => {
  const idx = FIELDS.findIndex(f => f.id === t.dataset.id);
  t.addEventListener('click', () => openPad(idx));
  t.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openPad(idx); } });
});
// 入力欄・テンキー以外をタップしたらテンキーを閉じる
document.addEventListener('click', e => {
  if(!document.body.classList.contains('pad-open')) return;
  if(e.target.closest('.tile, .numpad, #clearBtn')) return;
  closePad();
});
document.getElementById('calcBtn').addEventListener('click', calculate);
document.getElementById('clearBtn').addEventListener('click', onClearTap);
document.getElementById('editBtn').addEventListener('click', showInput);
window.addEventListener('resize', measurePad);

// PCなど物理キーボードでも入力可
document.addEventListener('keydown', e => {
  if(!document.body.classList.contains('pad-open')) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(/^\d$/.test(e.key)){ press(e.key); e.preventDefault(); }
  else if(e.key === 'Backspace'){ press('back'); e.preventDefault(); }
  else if(e.key === 'Enter' || e.key === 'ArrowDown'){ goNext(); e.preventDefault(); }
  else if(e.key === 'ArrowUp'){ goPrev(); e.preventDefault(); }
});
</script>
