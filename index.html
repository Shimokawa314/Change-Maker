<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Change Maker | 給与両替 計算ツール</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Change Maker">
<meta name="theme-color" content="#1F2B23">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #EDF2E7;
    --paper-stripe: #DEE8D8;
    --ink: #1F2B23;
    --ink-soft: #5C6B60;
    --ink-faint: #93A296;
    --brass: #B8894A;
    --brass-deep: #8F6B38;
    --line: #C7D3BE;
    --white: #F8FAF6;
    --danger: #A15C4A;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:
      repeating-linear-gradient(
        to bottom,
        var(--paper) 0px, var(--paper) 27px,
        var(--paper-stripe) 27px, var(--paper-stripe) 54px
      );
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    padding: 20px 16px 60px;
  }
  .wrap{ max-width:420px; margin:0 auto; }

  header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    border-bottom: 2px solid var(--ink);
    padding-bottom:14px;
    margin-bottom: 22px;
  }
  header .title{
    font-family:'Zen Old Mincho', serif;
    font-weight:700;
    font-size: 26px;
    letter-spacing: 0.04em;
  }
  header .title small{
    display:block;
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size: 11px;
    font-weight:500;
    color: var(--ink-soft);
    letter-spacing: 0.14em;
    margin-top:4px;
  }
  section{ margin-bottom: 26px; }
  .sec-label{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Zen Old Mincho', serif;
    font-weight:700;
    font-size:15px;
    margin-bottom:10px;
    color:var(--ink);
  }
  .sec-label .num{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    background:var(--ink);
    color:var(--paper);
    padding:2px 7px;
    border-radius:1px;
  }
  .sec-sub{
    font-size:12px;
    color:var(--ink-soft);
    margin: -4px 0 12px;
    line-height:1.6;
  }

  .card{
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 4px 14px;
  }

  .row{
    display:flex;
    align-items:center;
    padding: 11px 0;
    border-bottom: 1px solid var(--line);
    gap:12px;
  }
  .row:last-child{ border-bottom:none; }

  .chip{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:600;
    color:var(--white);
    background: var(--ink);
  }
  .chip.note{ width:54px; height:30px; border-radius:3px; font-size:11px; }
  .chip.coin{ border-radius:50%; font-size:10px; background:var(--brass-deep); }
  .chip.coin.c500{ width:34px; height:34px; }
  .chip.coin.c100{ width:30px; height:30px; }
  .chip.coin.c50{ width:28px; height:28px; }
  .chip.coin.c10{ width:26px; height:26px; }
  .chip.coin.c5{ width:24px; height:24px; }
  .chip.coin.c1{ width:22px; height:22px; background:var(--ink-faint); color:var(--ink); }

  .row .label{
    font-size:13px;
    color:var(--ink-soft);
    width:56px;
    flex-shrink:0;
  }

  .row input[type=number]{
    margin-left:auto;
    width:88px;
    text-align:right;
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    font-weight:500;
    color:var(--ink);
    background:transparent;
    border:none;
    border-bottom: 1px solid var(--line);
    padding: 4px 2px;
    -moz-appearance:textfield;
  }
  .row input[type=number]:focus{
    outline:none;
    border-bottom: 1px solid var(--brass);
  }
  .row .unit{ font-size:12px; color:var(--ink-faint); width:16px; }
  input::-webkit-outer-spin-button, input::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }

  .withdraw-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .withdraw-row:last-child{ border-bottom:none; }
  .withdraw-row .idx{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--white);
    background:var(--ink-soft);
    width:20px; height:20px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .withdraw-row input{
    flex:1;
    text-align:right;
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    font-weight:500;
    color:var(--ink);
    background:transparent;
    border:none;
    border-bottom:1px solid var(--line);
    padding:6px 2px;
  }
  .withdraw-row input:focus{ outline:none; border-bottom:1px solid var(--brass); }
  .withdraw-row .yen{ font-size:12px; color:var(--ink-faint); }

  .btnbar{
    display:flex;
    gap:10px;
    margin: 24px 0 8px;
  }
  button{
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:14px;
    border:none;
    border-radius:2px;
    padding: 14px 18px;
    cursor:pointer;
    letter-spacing:0.04em;
  }
  #calcBtn{
    flex:1;
    background: var(--ink);
    color: var(--paper);
    transition: transform 0.08s ease, background 0.15s ease;
  }
  #calcBtn:hover{ background:#152018; }
  #calcBtn:active{ transform: scale(0.98); }
  #resetBtn{
    background:transparent;
    color: var(--ink-soft);
    border: 1px solid var(--line);
  }
  #resetBtn:hover{ border-color: var(--danger); color: var(--danger); }

  #result{
    display:none;
    margin-top: 30px;
  }
  .stamp-line{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:16px;
  }
  .stamp-line::after{
    content:"";
    flex:1;
    height:1px;
    background: var(--line);
  }
  .stamp{
    font-family:'Zen Old Mincho', serif;
    font-weight:700;
    font-size:15px;
    color: var(--brass-deep);
    border: 1.5px solid var(--brass-deep);
    padding: 4px 10px;
    border-radius: 2px;
    transform: rotate(-2deg);
    display:inline-block;
    opacity:0;
  }
  .stamp.show{
    animation: stampIn 0.35s ease forwards;
  }
  @keyframes stampIn{
    0%{ opacity:0; transform: rotate(-2deg) scale(1.6); }
    60%{ opacity:1; }
    100%{ opacity:1; transform: rotate(-2deg) scale(1); }
  }

  .result-row{
    display:flex;
    align-items:center;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    gap:12px;
    opacity:0;
    transform: translateY(4px);
  }
  .result-row.show{
    animation: rowIn 0.3s ease forwards;
  }
  @keyframes rowIn{
    to{ opacity:1; transform:translateY(0); }
  }
  .result-row:last-child{ border-bottom:none; }
  .result-row .label{ font-size:13px; color:var(--ink-soft); width:56px; flex-shrink:0; }
  .result-row .count{
    margin-left:auto;
    font-family:'JetBrains Mono', monospace;
    font-size:19px;
    font-weight:600;
    color: var(--ink);
  }
  .result-row .count.zero{ color: var(--ink-faint); font-weight:400; }
  .result-row .unit{ font-size:12px; color:var(--ink-faint); }
  .result-row .sub{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color: var(--ink-faint);
    width:78px;
    text-align:right;
  }

  .total-box{
    margin-top:16px;
    background: var(--ink);
    color: var(--paper);
    border-radius:3px;
    padding: 16px 18px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .total-box .t-label{
    font-family:'Zen Old Mincho', serif;
    font-size:14px;
  }
  .total-box .t-value{
    font-family:'JetBrains Mono', monospace;
    font-size:24px;
    font-weight:700;
    color: var(--brass);
  }
  .total-box .t-value span{ font-size:14px; margin-left:2px; color:var(--paper); }

  footer{
    text-align:center;
    margin-top: 40px;
    font-size:11px;
    color: var(--ink-faint);
    font-family:'JetBrains Mono', monospace;
    letter-spacing:0.06em;
  }

  @media (max-width:400px){
    .row .label{ width:44px; }
    .row input[type=number]{ width:70px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title">Change Maker<small>給与両替 枚数計算</small></div>
  </header>

  <section>
    <div class="sec-label"><span class="num">01</span>必要な金種内訳</div>
    <div class="sec-sub">支給に必要な枚数を入力してください。1万円札は引き出しで直接まかなうため対象外です。</div>
    <div class="card" id="needCard"></div>
  </section>

  <section>
    <div class="sec-label"><span class="num">02</span>引き出し金額(4件)</div>
    <div class="sec-sub">それぞれの引き出し額から、千円・百円・十円・一円で確実に含まれる枚数を自動算出し、必要枚数から差し引きます。</div>
    <div class="card" id="withdrawCard"></div>
  </section>

  <div class="btnbar">
    <button id="calcBtn">計算する</button>
    <button id="resetBtn">クリア</button>
  </div>

  <div id="result">
    <div class="stamp-line"><span class="stamp" id="stamp">用意すべき枚数</span></div>
    <div class="card" id="resultCard"></div>
    <div class="total-box">
      <span class="t-label">要両替額</span>
      <span class="t-value" id="totalValue">0<span>円</span></span>
    </div>
  </div>

  <footer>CHANGE MAKER &middot; 1万円単位 両替補助ツール</footer>
</div>

<script>
const DENOMS = [5000,1000,500,100,50,10,5,1];
const NOTES = [5000,1000];
const LABELS = {5000:'5千円',1000:'千円',500:'500円',100:'100円',50:'50円',10:'10円',5:'5円',1:'1円'};
const STORE_KEY = 'denomi_v1';

function buildNeedCard(){
  const card = document.getElementById('needCard');
  card.innerHTML = DENOMS.map(d => {
    const isNote = NOTES.includes(d);
    const chipClass = isNote ? 'chip note' : `chip coin c${d}`;
    return `
      <div class="row">
        <div class="${chipClass}">${isNote ? d/1000 + '000' : d}</div>
        <div class="label">${LABELS[d]}</div>
        <input type="number" inputmode="numeric" min="0" step="1" id="need-${d}" value="0">
        <div class="unit">枚</div>
      </div>`;
  }).join('');
}

function buildWithdrawCard(){
  const card = document.getElementById('withdrawCard');
  card.innerHTML = [1,2,3,4].map(i => `
    <div class="withdraw-row">
      <div class="idx">${i}</div>
      <input type="number" inputmode="numeric" min="0" step="1" id="withdraw-${i}" placeholder="0">
      <div class="yen">円</div>
    </div>`).join('');
}

function saveState(){
  const state = {};
  DENOMS.forEach(d => state['need-'+d] = document.getElementById('need-'+d).value);
  [1,2,3,4].forEach(i => state['withdraw-'+i] = document.getElementById('withdraw-'+i).value);
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }catch(e){}
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(!raw) return;
    const state = JSON.parse(raw);
    Object.keys(state).forEach(id => {
      const el = document.getElementById(id);
      if(el && state[id] !== '') el.value = state[id];
    });
  }catch(e){}
}

function num(id){
  const el = document.getElementById(id);
  const v = parseInt(el.value, 10);
  return isNaN(v) || v < 0 ? 0 : v;
}

function calculate(){
  // 1. 入力内訳の読み取り(1万円札は対象外)
  const inputCounts = {};
  DENOMS.forEach(d => inputCounts[d] = num('need-'+d));

  // 2. 4件の引き出し額から確実にある枚数を算出(個別に計算し合算)
  const guaranteed = {1000:0, 100:0, 10:0, 1:0};
  [1,2,3,4].forEach(i => {
    const T = num('withdraw-'+i);
    guaranteed[1000] += Math.floor((T % 5000)/1000);
    guaranteed[100]  += Math.floor((T % 500)/100);
    guaranteed[10]   += Math.floor((T % 50)/10);
    guaranteed[1]    += Math.floor((T % 5)/1);
  });

  // 3. 必要枚数から確実にある分を差し引く(マイナスは0で止める)
  const adjusted = {...inputCounts};
  [1000,100,10,1].forEach(d => {
    adjusted[d] = Math.max(0, inputCounts[d] - guaranteed[d]);
  });

  // 4. 差し引き後の合計を1万円単位に切り上げ
  const adjustedTotal = DENOMS.reduce((sum,d) => sum + d*adjusted[d], 0);
  const rounded = Math.ceil(adjustedTotal/10000)*10000;
  let remaining = rounded - adjustedTotal;

  // 5. 差額を大きい金種から充当
  const fillDenoms = [5000,1000,500,100,50,10,5,1];
  const final = {...adjusted};
  fillDenoms.forEach(d => {
    const c = Math.floor(remaining/d);
    final[d] += c;
    remaining -= c*d;
  });

  renderResult(final);
  saveState();
}

function renderResult(final){
  const card = document.getElementById('resultCard');
  card.innerHTML = '';
  let grandTotal = 0;

  DENOMS.forEach((d, idx) => {
    const isNote = NOTES.includes(d);
    const chipClass = isNote ? 'chip note' : `chip coin c${d}`;
    const count = final[d];
    const sub = d*count;
    grandTotal += sub;

    const row = document.createElement('div');
    row.className = 'result-row';
    row.style.animationDelay = (idx*45) + 'ms';
    row.innerHTML = `
      <div class="${chipClass}">${isNote ? d/1000 + '000' : d}</div>
      <div class="label">${LABELS[d]}</div>
      <div class="count ${count===0?'zero':''}">${count}</div>
      <div class="unit">枚</div>
      <div class="sub">${sub.toLocaleString()}円</div>
    `;
    card.appendChild(row);
    requestAnimationFrame(() => row.classList.add('show'));
  });

  document.getElementById('totalValue').innerHTML = grandTotal.toLocaleString() + '<span>円</span>';
  document.getElementById('result').style.display = 'block';

  const stamp = document.getElementById('stamp');
  stamp.classList.remove('show');
  void stamp.offsetWidth;
  stamp.classList.add('show');
}

function resetAll(){
  DENOMS.forEach(d => document.getElementById('need-'+d).value = 0);
  [1,2,3,4].forEach(i => document.getElementById('withdraw-'+i).value = '');
  document.getElementById('result').style.display = 'none';
  try{ localStorage.removeItem(STORE_KEY); }catch(e){}
}

buildNeedCard();
buildWithdrawCard();
loadState();
document.getElementById('calcBtn').addEventListener('click', calculate);
document.getElementById('resetBtn').addEventListener('click', resetAll);
</script>
</body>
</html>
